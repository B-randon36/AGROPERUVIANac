<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" role="img" aria-label="C1 · Diagrama de Contexto del Sistema (GDMERP)">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.6"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1080" height="580" rx="20" fill="#f2f7f3"/>
  <text x="36" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#153e31">C1 · Diagrama de Contexto del Sistema (GDMERP)</text>
  <text x="36" y="64" font-family="Arial,sans-serif" font-size="13.5" fill="#4e655b">Actores del negocio agroindustrial, núcleo ERP y sistemas externos de identidad y consulta DNI/RUC.</text>

  <!-- Grupo Actores -->
  <rect x="36" y="96" width="300" height="456" rx="14" fill="#ffffff" fill-opacity="0.55" stroke="#b7cbbd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="52" y="118" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#153e31" letter-spacing="0.5">ACTORES DEL NEGOCIO</text>

  <rect x="52" y="132" width="268" height="106" rx="10" fill="#ffffff" stroke="#bdd1c3" stroke-width="1.5"/>
  <rect x="52" y="132" width="6" height="106" rx="3" fill="#0f766e"/>
  <text x="70" y="158" font-family="Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0f766e">Supervisor / Administrador</text>
  <text x="70" y="180" font-family="Arial,sans-serif" font-size="12" fill="#475569">Aprueba o rechaza anulaciones</text>
  <text x="70" y="198" font-family="Arial,sans-serif" font-size="12" fill="#475569">Gestiona catálogo, compras y producción</text>
  <text x="70" y="216" font-family="Arial,sans-serif" font-size="12" fill="#475569">Audita operaciones y cajas</text>

  <rect x="52" y="258" width="268" height="110" rx="10" fill="#ffffff" stroke="#bdd1c3" stroke-width="1.5"/>
  <rect x="52" y="258" width="6" height="110" rx="3" fill="#0f766e"/>
  <text x="70" y="284" font-family="Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0f766e">Ejecutivo de Ventas / Cajero</text>
  <text x="70" y="306" font-family="Arial,sans-serif" font-size="12" fill="#475569">Registra ventas POS y delivery</text>
  <text x="70" y="324" font-family="Arial,sans-serif" font-size="12" fill="#475569">Abre/cierra caja, emite ticket 80mm</text>
  <text x="70" y="342" font-family="Arial,sans-serif" font-size="12" fill="#475569">Solicita anulaciones (VENDEDOR)</text>

  <rect x="52" y="424" width="268" height="108" rx="10" fill="#ffffff" stroke="#bdd1c3" stroke-width="1.5"/>
  <rect x="52" y="424" width="6" height="108" rx="3" fill="#0f766e"/>
  <text x="70" y="450" font-family="Arial,sans-serif" font-size="15.5" font-weight="700" fill="#0f766e">Cliente Mayorista / Minorista</text>
  <text x="70" y="472" font-family="Arial,sans-serif" font-size="12" fill="#475569">Compra en ventanilla o delivery</text>
  <text x="70" y="490" font-family="Arial,sans-serif" font-size="12" fill="#475569">Entrega datos DNI/RUC y pago</text>
  <text x="70" y="508" font-family="Arial,sans-serif" font-size="12" fill="#475569">Recibe comprobante y despacho</text>

  <!-- Núcleo GDMERP -->
  <rect x="415" y="205" width="265" height="175" rx="14" fill="#166534" stroke="#14532d" stroke-width="2"/>
  <text x="547.5" y="236" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">ERP Agro Peruvian Foods</text>
  <text x="547.5" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#bbf7d0">(GDMERP)</text>
  <line x1="440" y1="272" x2="655" y2="272" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
  <text x="547.5" y="294" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" fill="#ecfdf5">Ventas POS · Control de Caja</text>
  <text x="547.5" y="314" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" fill="#ecfdf5">Inventario FEFO · Kardex Físico</text>
  <text x="547.5" y="334" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" fill="#ecfdf5">Compras · Producción BOM</text>
  <text x="547.5" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" fill="#bbf7d0">Spring Boot 4.0.7 + Angular 22</text>

  <!-- Grupo Externos -->
  <rect x="756" y="132" width="288" height="362" rx="14" fill="#ffffff" fill-opacity="0.55" stroke="#b7cbbd" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="772" y="154" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#153e31" letter-spacing="0.5">SISTEMAS EXTERNOS</text>

  <rect x="772" y="170" width="256" height="130" rx="10" fill="#ffffff" stroke="#bdd1c3" stroke-width="1.5"/>
  <rect x="772" y="170" width="6" height="130" rx="3" fill="#7c3aed"/>
  <text x="790" y="196" font-family="Arial,sans-serif" font-size="15.5" font-weight="700" fill="#5b21b6">Keycloak 26.8.0 (IdP OIDC)</text>
  <text x="790" y="218" font-family="Arial,sans-serif" font-size="12" fill="#475569">Autenticación JWT, SSO y PKCE</text>
  <text x="790" y="236" font-family="Arial,sans-serif" font-size="12" fill="#475569">Realm: bomerp</text>
  <text x="790" y="254" font-family="Arial,sans-serif" font-size="12" fill="#475569">Roles: ADMIN, SUPERVISOR,</text>
  <text x="790" y="272" font-family="Arial,sans-serif" font-size="12" fill="#475569">VENDEDOR, CAJERO</text>

  <rect x="772" y="330" width="256" height="142" rx="10" fill="#ffffff" stroke="#bdd1c3" stroke-width="1.5"/>
  <rect x="772" y="330" width="6" height="142" rx="3" fill="#334155"/>
  <text x="790" y="356" font-family="Arial,sans-serif" font-size="15.5" font-weight="700" fill="#1e293b">ApisPeru · Consulta DNI/RUC</text>
  <text x="790" y="378" font-family="Arial,sans-serif" font-size="12" fill="#475569">Validación de identidad y razón</text>
  <text x="790" y="396" font-family="Arial,sans-serif" font-size="12" fill="#475569">social por API REST HTTPS</text>
  <text x="790" y="420" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="#b45309">Solo consulta documental</text>
  <text x="790" y="438" font-family="Arial,sans-serif" font-size="11.5" fill="#64748b">(No es homologación SUNAT)</text>

  <!-- Conexiones -->
  <!-- Cliente -> Vendedor -->
  <path d="M186,424 L186,374" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)" fill="none"/>
  <rect x="116" y="388" width="140" height="20" rx="5" fill="#f2f7f3"/>
  <text x="186" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#475569">DNI/RUC y pago</text>

  <!-- Supervisor -> GDMERP -->
  <path d="M320,185 L370,185 L370,250 L412,250" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>
  <rect x="336" y="160" width="128" height="20" rx="5" fill="#f2f7f3"/>
  <text x="400" y="174" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#334155">Audita / Aprueba (HTTP)</text>

  <!-- Vendedor -> GDMERP -->
  <path d="M320,313 L412,313" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>
  <rect x="325" y="289" width="84" height="20" rx="5" fill="#f2f7f3"/>
  <text x="367" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#334155">POS (HTTP)</text>

  <!-- Actores -> Keycloak (OIDC PKCE por arriba) -->
  <path d="M240,132 L240,104 L900,104 L900,166" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>
  <rect x="460" y="92" width="230" height="22" rx="6" fill="#f2f7f3"/>
  <text x="575" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="11.5" font-weight="700" fill="#5b21b6">Login OIDC (Authorization Code + PKCE)</text>

  <!-- GDMERP -> Keycloak -->
  <path d="M680,248 L768,248" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>
  <rect x="683" y="224" width="82" height="20" rx="5" fill="#f2f7f3"/>
  <text x="724" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#334155">Valida JWT</text>

  <!-- GDMERP -> ApisPeru -->
  <path d="M680,335 L726,335 L726,395 L768,395" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" fill="none"/>
  <rect x="682" y="370" width="86" height="20" rx="5" fill="#f2f7f3"/>
  <text x="725" y="384" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#334155">REST HTTPS</text>
</svg>
